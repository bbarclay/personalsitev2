<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aa00;stop-opacity:1" />
    </linearGradient>
    <filter id="codeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Frame -->
  <rect x="40" y="40" width="120" height="120" rx="10" fill="none" stroke="url(#codeGradient)" stroke-width="3" filter="url(#codeGlow)"/>
  
  <!-- Code Brackets -->
  <g stroke="#00ff00" stroke-width="3" fill="none">
    <!-- Left Bracket -->
    <path d="M 60,60 L 50,60 L 50,140 L 60,140"/>
    <!-- Right Bracket -->
    <path d="M 140,60 L 150,60 L 150,140 L 140,140"/>
  </g>
  
  <!-- Code Lines -->
  <g opacity="0.8">
    <line x1="70" y1="80" x2="130" y2="80" stroke="#00ff00" stroke-width="2"/>
    <line x1="70" y1="95" x2="110" y2="95" stroke="#00dd00" stroke-width="2"/>
    <line x1="80" y1="110" x2="120" y2="110" stroke="#00bb00" stroke-width="2"/>
    <line x1="70" y1="125" x2="125" y2="125" stroke="#00dd00" stroke-width="2"/>
    <line x1="80" y1="140" x2="100" y2="140" stroke="#00bb00" stroke-width="2"/>
  </g>
  
  <!-- Tech Stack Layers -->
  <g font-family="monospace" font-size="10" fill="#00ff00" text-anchor="middle">
    <text x="100" y="50">UI</text>
    <text x="100" y="165">DB</text>
  </g>
  
  <!-- Animated Data Flow -->
  <circle cx="100" cy="70" r="3" fill="#00ff00">
    <animate attributeName="cy" values="70;130;70" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
