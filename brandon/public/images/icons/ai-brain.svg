<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Brain Outline -->
  <path d="M100,40 Q120,40 130,50 Q140,60 140,80 Q140,100 130,110 Q140,120 140,140 Q140,160 120,160 Q110,170 100,170 Q90,170 80,160 Q60,160 60,140 Q60,120 70,110 Q60,100 60,80 Q60,60 70,50 Q80,40 100,40 Z" 
        fill="none" stroke="url(#aiGradient)" stroke-width="3" filter="url(#aiGlow)"/>
  
  <!-- Neural Network Inside -->
  <g opacity="0.8">
    <!-- Neurons -->
    <circle cx="100" cy="70" r="5" fill="#00ffff"/>
    <circle cx="80" cy="90" r="4" fill="#00ddff"/>
    <circle cx="120" cy="90" r="4" fill="#00ddff"/>
    <circle cx="90" cy="110" r="4" fill="#00bbff"/>
    <circle cx="110" cy="110" r="4" fill="#00bbff"/>
    <circle cx="100" cy="130" r="5" fill="#00ffff"/>
    
    <!-- Synapses -->
    <line x1="100" y1="70" x2="80" y2="90" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="70" x2="120" y2="90" stroke="#00ffff" stroke-width="2" opacity="0.6"/>
    <line x1="80" y1="90" x2="90" y2="110" stroke="#00ddff" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="90" x2="110" y2="110" stroke="#00ddff" stroke-width="1.5" opacity="0.5"/>
    <line x1="90" y1="110" x2="100" y2="130" stroke="#00bbff" stroke-width="1.5" opacity="0.5"/>
    <line x1="110" y1="110" x2="100" y2="130" stroke="#00bbff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Pulse Animation -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="50;60;50" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
