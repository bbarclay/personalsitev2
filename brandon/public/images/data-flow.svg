<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Data Flow Lines -->
  <g id="dataFlow">
    <!-- Horizontal Flow -->
    <line x1="0" y1="100" x2="400" y2="100" stroke="url(#flowGradient)" stroke-width="2">
      <animate attributeName="x1" values="0;400;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="400;800;400" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="150" x2="400" y2="150" stroke="url(#flowGradient)" stroke-width="2">
      <animate attributeName="x1" values="400;0;400" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800;400;800" dur="4s" repeatCount="indefinite"/>
    </line>
    
    <line x1="0" y1="200" x2="400" y2="200" stroke="url(#flowGradient)" stroke-width="2">
      <animate attributeName="x1" values="0;400;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="400;800;400" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Data Packets -->
  <g id="packets">
    <circle r="4" fill="#00ffff">
      <animateMotion path="M 0,100 L 400,100" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#0088ff">
      <animateMotion path="M 400,150 L 0,150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#00ddff">
      <animateMotion path="M 0,200 L 400,200" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
